<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gramzdas iedzīvotāju padomes ideju siena. Iesniedz savu ideju pagasta attīstībai un balso par citām.">
    
    <!-- Sociālo tīklu meta tagi -->
    <meta property="og:title" content="Idejas | Gramzdas iedzīvotāju padome">
    <meta property="og:description" content="Iesniedz savu ideju pagasta attīstībai un balso par citām iedzīvotāju idejām.">
    <meta property="og:image" content="https://dawis86.github.io/Ipadome_Gramzda/prezentacijas/2026-marts/padomes_locekli.jpg">
    <meta property="og:url" content="https://dawis86.github.io/Ipadome_Gramzda/idejas.html">
    <meta property="og:type" content="website">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.gstatic.com https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://script.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; connect-src 'self' https://docs.google.com https://script.google.com https://accounts.google.com https://*.firebasedatabase.app https://www.google-analytics.com https://*.googleusercontent.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://*.openstreetmap.org https://docs.google.com; frame-src https://docs.google.com;">

    <title>Idejas | Gramzdas iedzīvotāju padome</title>
    <link rel="stylesheet" href="idejas.css">

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-71M8PT9VHP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-71M8PT9VHP');
    </script>
</head>
<body>

    <header class="hero small-hero">
        <div class="hero-content">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Atpakaļ uz sākumu</a>
            <h1>Ideju siena</h1>
            <p>Tava ideja var mainīt Gramzdu. Pieliec to pie sienas!</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="scroll-container">
        <div class="container">
            <!-- TOP 3 IDEJAS -->
            <div class="top-ideas-container">
                <h2><i class="fa-solid fa-fire" style="color: var(--gold);"></i> Populārākās idejas</h2>
                <div class="top-ideas-grid" id="top-ideas-grid"></div>
            </div>

            <div class="board" id="board">
                <!-- Add Idea Button -->
                <a href="#" class="note add-note" id="open-idea-modal">
                    <i class="fa-solid fa-plus"></i>
                    <h3>Pievienot ideju</h3>
                </a>

                <!-- Ielādes indikators, kas aizņems visu platumu -->
                <div id="loading-indicator" class="loading-placeholder">
                    <div class="skeleton-card" style="transform: rotate(-2deg);"></div>
                    <div class="skeleton-card" style="transform: rotate(2deg);"></div>
                    <div class="skeleton-card" style="transform: rotate(-1deg);"></div>
                    <div class="skeleton-card"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- JAUNS: Modālais logs idejas pievienošanai -->
    <div id="idea-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-idea-modal">&times;</span>
            <h2>Iesniegt ideju</h2>
            <p style="margin-bottom: 20px;">Tava ideja tiks publicēta pēc veiksmīgas nosūtīšanas.</p>
            <form id="idea-form">
                <div class="form-group">
                    <label>Kāda ir Tava ideja, ierosinājums?</label>
                    <input type="text" name="title" placeholder="Īss virsraksts..." required maxlength="60">
                </div>
                <div class="form-group">
                    <label>Apraksti precīzi, ko Tu ar to domāji?</label>
                    <textarea name="description" rows="5" placeholder="Sīkāks izklāsts..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Kategorija</label>
                    <select name="category">
                        <option value="Vide un infrastruktūra">Vide un infrastruktūra</option>
                        <option value="Kultūra un atpūta">Kultūra un atpūta</option>
                        <option value="Izglītība un sports">Izglītība un sports</option>
                        <option value="Sociālie jautājumi">Sociālie jautājumi</option>
                        <option value="Cits">Cits</option>
                    </select>
                </div>
                <div style="text-align: center; margin-top: 30px;">
                    <button type="submit" class="cta-button">Iesniegt sienai</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Gramzdas iedzīvotāju padome. Izstrādāts iedzīvotāju interesēs.<br class="br-mobile"> <span id="data-freshness"></span></p>
    </footer>

    <script type="module" src="scripts/idejas.js"></script>
</body>
</html>
