<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gramzdas Iedzīvotāju Padodes digitālais centrs - vieda komunikācija un caurspīdīga pārvaldība">
<meta name="keywords" content="Gramzda, iedzīvotāji, padode, Latvija, aptauja">

    <!-- Leaflet.js stili (kartes bibliotēka) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="karte.css">

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-71M8PT9VHP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-71M8PT9VHP');
    </script>
</head>
<body>

    <header class="hero small-hero">
        <div class="hero-content">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Atpakaļ uz sākumu</a>
            <h1>Problēmu karte</h1>
            <p>Redzi problēmu? Klikšķini uz kartes, lai ziņotu!</p>
        </div>
    </header>

    <main class="scroll-container" style="padding: 0;">
        <div id="map"></div>
    </main>

    <!-- JAUNS: Modālais logs problēmas ziņošanai -->
    <div id="report-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-report-modal">&times;</span>
            <h2>Ziņot par problēmu</h2>
            <p>Izvēlētā vieta: <span id="display-coords" style="color:var(--gold); font-weight:bold;"></span></p>
            <form id="report-form" style="margin-top:20px;">
                <input type="hidden" name="lat" id="form-lat">
                <input type="hidden" name="lng" id="form-lng">
                <div class="form-group">
                    <label>Kategorija</label>
                    <select name="category">
                        <option value="Ceļi un bedres">Ceļi un bedres</option>
                        <option value="Apgaismojums">Apgaismojums</option>
                        <option value="Atkritumi">Atkritumi</option>
                        <option value="Bērnu laukumi">Bērnu laukumi</option>
                        <option value="Cits">Cits</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Problēmas apraksts</label>
                    <textarea name="description" rows="4" placeholder="Kas tieši tur ir noticis?" required></textarea>
                </div>
                <button type="submit" class="cta-button" style="width:100%;">Nosūtīt ziņojumu</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Gramzdas iedzīvotāju padome. Izstrādāts iedzīvotāju interesēs.<br class="br-mobile"> <span id="data-freshness"></span></p>
    </footer>

    <!-- Leaflet.js skripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script type="module" src="scripts/karte.js"></script>
</body>
</html>
